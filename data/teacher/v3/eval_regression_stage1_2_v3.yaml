version: '3.0'
purpose: EOT Stage 1–2 architecture and pedagogy release gate for Writing/Translation-centered adaptive learning.
case_count: 123
cases:
- id: GND-001
  name: bare-forgot
  category: grounding
  setup:
    teacher_prompt: Rewrite the sentence in two clearer clauses.
    learner_turn: 我忘記了
  must:
  - mark referent/meaning unresolved
  - clarify the referent minimally before diagnosing
  - write no capability-failure evidence
  must_not:
  - infer task-too-hard
  - increase support automatically
  - supply a model sentence
  - invent what the learner forgot
  hard_gate: true
  expected_action_family:
  - CLARIFY
- id: GND-002
  name: forgot-original-intent-explicit
  category: grounding
  setup:
    artifact_age: old
    learner_turn: 我忘記我當時想表達什麼了
  must:
  - treat memory-of-intent as unavailable context, not English failure
  - recover what can be inferred from prompt and surrounding artifact
  - defer intent-dependent diagnosis if needed
  must_not:
  - lower composition capability because of memory failure
  - force autobiographical reconstruction
  - invent a single original meaning
  hard_gate: true
  expected_action_family:
  - ACKNOWLEDGE
  - CLARIFY
  - DEFER
  contrast_group: FORGOT
- id: GND-003
  name: forgot-word-explicit
  category: grounding
  setup:
    current_focus: lexical retrieval
    learner_turn: 我忘記那個英文單字了
  must:
  - treat as lexical-help signal only if target provenance/context supports it
  - use minimal retrieval support appropriate to history
  must_not:
  - treat as forgotten original intent
  - diagnose broad vocabulary weakness
  hard_gate: true
  expected_action_family:
  - INTERVENE
  contrast_group: FORGOT
- id: GND-004
  name: forgot-instruction-explicit
  category: grounding
  setup:
    teacher_instruction: 只改後半句
    learner_turn: 我忘記你剛剛要我做什麼
  must:
  - restate current task succinctly
  - write no capability evidence
  must_not:
  - teach English content merely because instruction was forgotten
  - record failure
  hard_gate: true
  expected_action_family:
  - ANSWER
  - ACKNOWLEDGE
  contrast_group: FORGOT
- id: GND-005
  name: bare-dont-know-after-error-notice
  category: grounding
  setup:
    teacher_prompt: 你看得出哪裡怪嗎？
    learner_turn: 不知道
  must:
  - interpret as inability to identify the issue only with current prompt grounding
  - choose contingent support without claiming underlying knowledge absent
  must_not:
  - declare grammar concept unknown as fact
  - dump full answer automatically
  hard_gate: true
  expected_action_family:
  - INTERVENE
  contrast_group: DONT_KNOW
- id: GND-006
  name: bare-dont-know-after-intent-question
  category: grounding
  setup:
    teacher_prompt: 你當時這裡想說「工作種類」還是「未來的工作世界」？
    artifact_age: old
    learner_turn: 不知道
  must:
  - recognize intended meaning remains unavailable
  - defer meaning-dependent correction
  - continue only with independent issues
  must_not:
  - treat as English semantic inability
  - pick an intent for learner
  hard_gate: true
  expected_action_family:
  - DEFER
  contrast_group: DONT_KNOW
- id: GND-007
  name: bare-no
  category: grounding
  setup:
    teacher_turn: 你是想說父母的管教會直接造成犯罪嗎？
    learner_turn: 不是
  must:
  - treat as rejection of Teacher interpretation
  - withdraw the rejected semantic hypothesis
  - ask only if additional clarification is necessary
  must_not:
  - treat as wrong answer
  - continue teaching against rejected meaning
  hard_gate: true
  expected_action_family:
  - ACKNOWLEDGE
  - CLARIFY
- id: GND-008
  name: huh-after-explanation
  category: grounding
  setup:
    previous_teacher_move: long explanation of allow
    learner_turn: 蛤
  must:
  - treat as possible grounding/teacher-induced confusion
  - check/reframe rather than infer learner deficit
  must_not:
  - repeat same explanation longer
  - record grammar failure from this turn
  hard_gate: true
  expected_action_family:
  - CLARIFY
  - CHANGE_STRATEGY
- id: GND-009
  name: weird-ambiguous
  category: grounding
  setup:
    learner_turn: 怪怪的
  must:
  - identify what the comment likely refers to or ask minimal clarification when material
  - write no capability evidence until grounded
  must_not:
  - assume the exact grammar issue
  - force an exercise
  hard_gate: true
  expected_action_family:
  - CLARIFY
- id: GND-010
  name: sort-of
  category: grounding
  setup:
    teacher_turn: 這是你原本想表達的意思嗎？
    learner_turn: 差不多
  must:
  - preserve partial grounding
  - keep uncertainty visible if exact intent matters
  - avoid treating tentative meaning as fully learner-confirmed
  must_not:
  - convert to fully confirmed semantic provenance when exact distinction matters
  hard_gate: true
  expected_action_family:
  - ACKNOWLEDGE
  - CLARIFY
- id: GND-011
  name: short-help
  category: grounding
  setup:
    learner_turn: 不會
  must:
  - use current task context to determine what scope is actually being claimed
  - if scope remains ambiguous, clarify before choosing remediation
  must_not:
  - map string directly to UNKNOWN_WORD or GRAMMAR_GAP
  hard_gate: true
  expected_action_family:
  - CLARIFY
  - INTERVENE
- id: GND-012
  name: question-is-not-attempt
  category: grounding
  setup:
    active_task: write a sentence
    learner_turn: flying colours 是什麼意思？
  must:
  - classify as learner question
  - answer/support the question based on current context
  - do not score the wording as task output
  must_not:
  - evaluate it as failed production
  - force the original task before answering
  hard_gate: true
  expected_action_family:
  - ANSWER
- id: GND-013
  name: social-turn
  category: grounding
  setup:
    learner_turn: 哈囉廢物又來啦，一樣的模式給我
  must:
  - separate social tone from instructional request
  - recover the referenced prior interaction mode if available
  must_not:
  - treat profanity as learning evidence
  - restart onboarding
  hard_gate: true
  expected_action_family:
  - ACKNOWLEDGE
- id: GND-014
  name: multiple-plausible-referents
  category: grounding
  setup:
    recent_context:
    - teacher corrected spelling
    - teacher asked about meaning
    learner_turn: 我說的是前面那個
  must:
  - resolve referent before teaching if both candidates imply different actions
  must_not:
  - guess one referent and commit evidence
  hard_gate: true
  expected_action_family:
  - CLARIFY
- id: GND-015
  name: ambiguity-irrelevant-to-action
  category: grounding
  setup:
    learner_turn: 我忘了
    context: learner is asking to pause and no diagnosis is needed
  must:
  - allow defer/pause without forcing clarification when ambiguity does not change a safe next action
  - write no capability evidence
  must_not:
  - interrogate merely to eliminate all uncertainty
  hard_gate: true
  expected_action_family:
  - DEFER
  - ACKNOWLEDGE
